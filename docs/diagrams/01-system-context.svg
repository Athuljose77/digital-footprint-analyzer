<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="962" viewBox="0 0 1400 962" role="img" aria-label="Desktop-only system context diagram">
  <defs>
    <marker id="arrow-local" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#5E6B75"/>
    </marker>
    <marker id="arrow-net" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#0F766E"/>
    </marker>
    <filter id="soft" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0B1F2A" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1400" height="962" fill="#FFFFFF"/>

  <!-- Local boundary -->
  <rect x="200" y="48" width="1120" height="564" rx="24" fill="#EFF8F6" stroke="#B9DDD6" stroke-width="2"/>
  <circle cx="232" cy="82" r="5" fill="#14B8A6"/>
  <text x="250" y="88" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" letter-spacing="1.2" fill="#0F766E">YOUR COMPUTER — LOCAL-FIRST</text>

  <!-- User -->
  <circle cx="86" cy="340" r="36" fill="#FFFFFF" stroke="#B9DDD6" stroke-width="2.5"/>
  <text x="86" y="348" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="middle" fill="#12232B">User</text>
  <path d="M122 340 L244 340" fill="none" stroke="#5E6B75" stroke-width="2.4" marker-end="url(#arrow-local)"/>

  <!-- Desktop app card -->
  <rect x="250" y="240" width="300" height="200" rx="14" fill="#0B1F2A" filter="url(#soft)"/>
  <rect x="250" y="240" width="300" height="9" rx="4.5" fill="#14B8A6"/>
  <text x="280" y="286" font-family="Arial, Helvetica, sans-serif" font-size="33" font-weight="700" fill="#FFFFFF">Desktop app</text>
  <text x="280" y="318" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#C9D8DC">PySide6 · one process</text>
  <line x1="280" y1="340" x2="520" y2="340" stroke="#2A4A54" stroke-width="1.5"/>
  <text x="280" y="370" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#9FB3B9">collectors · analysis</text>
  <text x="280" y="394" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#9FB3B9">scoring · actions</text>

  <!-- Local data card -->
  <rect x="900" y="120" width="370" height="122" rx="12" fill="#FFFFFF" stroke="#D8E3E3" stroke-width="2" filter="url(#soft)"/>
  <rect x="900" y="120" width="7" height="122" rx="3.5" fill="#14B8A6"/>
  <text x="932" y="156" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#12232B">Local data</text>
  <text x="932" y="187" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#5E6B75">history.db · actions.db</text>
  <text x="932" y="212" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#5E6B75">exports</text>

  <!-- Operating system card -->
  <rect x="900" y="282" width="370" height="190" rx="12" fill="#FFFFFF" stroke="#D8E3E3" stroke-width="2" filter="url(#soft)"/>
  <rect x="900" y="282" width="7" height="190" rx="3.5" fill="#14B8A6"/>
  <text x="932" y="320" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#12232B">Operating system</text>
  <text x="932" y="353" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#5E6B75">package databases · processes</text>
  <text x="932" y="380" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#5E6B75">startup entries · browser profiles</text>
  <text x="932" y="407" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#5E6B75">file metadata</text>

  <!-- Local arrows -->
  <path d="M550 284 C650 250 760 205 892 180" fill="none" stroke="#5E6B75" stroke-width="2.4" marker-end="url(#arrow-local)"/>
  <path d="M550 344 C660 338 780 348 892 360" fill="none" stroke="#5E6B75" stroke-width="2.4" marker-end="url(#arrow-local)"/>

  <!-- Local-only callout -->
  <circle cx="912" cy="521" r="5" fill="#14B8A6"/>
  <text x="932" y="528" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#0F766E">No server process</text>
  <text x="932" y="555" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#5E6B75">Local scans stay on this machine.</text>

  <!-- Public internet boundary -->
  <rect x="760" y="650" width="520" height="260" rx="22" fill="#F8F9F9" stroke="#D8E3E3" stroke-width="2" stroke-dasharray="8 6"/>
  <circle cx="792" cy="682" r="5" fill="#0F766E"/>
  <text x="810" y="688" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" letter-spacing="1.1" fill="#5E6B75">PUBLIC INTERNET — LOOKUP SCANS ONLY</text>

  <!-- Public lookup cards -->
  <rect x="840" y="720" width="380" height="72" rx="10" fill="#FFFFFF" stroke="#D8E3E3" stroke-width="2" filter="url(#soft)"/>
  <text x="870" y="748" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#12232B">Public platforms</text>
  <text x="870" y="773" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#5E6B75">profile pages</text>

  <rect x="840" y="815" width="380" height="72" rx="10" fill="#FFFFFF" stroke="#D8E3E3" stroke-width="2" filter="url(#soft)"/>
  <text x="870" y="843" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#12232B">Email exposure check</text>
  <text x="870" y="868" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#5E6B75">breach lookup</text>

  <!-- Network lookup arrows -->
  <path d="M430 440 C470 540 560 640 680 695 C740 722 790 742 838 750" fill="none" stroke="#0F766E" stroke-width="2.8" stroke-dasharray="7 5" marker-end="url(#arrow-net)"/>
  <path d="M400 440 C430 620 500 790 620 845 C700 878 780 858 838 850" fill="none" stroke="#0F766E" stroke-width="2.8" stroke-dasharray="7 5" marker-end="url(#arrow-net)"/>

  <!-- Lookup labels -->
  <text x="560" y="560" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#0F766E" paint-order="stroke" stroke="#EFF8F6" stroke-width="6">username scan</text>
  <text x="560" y="586" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#5E6B75" paint-order="stroke" stroke="#EFF8F6" stroke-width="6">discovery + verification</text>
  <text x="510" y="782" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#0F766E" paint-order="stroke" stroke="#FFFFFF" stroke-width="6">email scan</text>
</svg>
